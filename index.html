<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#111111" />
<title>BLACK OWL 試合スコア入力</title>
<style>
  :root{
    --bg:#f3f3f3;
    --card:#fff;
    --ink:#111;
    --muted:#6d6d6d;
    --line:#d4d4d4;
    --soft:#ededed;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:contain;
  }
  .app{max-width:760px;margin:0 auto;padding:10px 10px 112px}
  h1{font-size:19px;text-align:center;margin:6px 0 12px}
  h2{font-size:15px;margin:0}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px;margin-bottom:10px;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
  input[type=text]{
    width:100%;font-size:16px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:white;
  }
  .sectionhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
  .hint{font-size:11px;color:var(--muted);line-height:1.45}
  .numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  button{
    font:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  }
  .num{
    min-height:50px;border:1px solid #b8b8b8;border-radius:12px;background:#fff;
    font-size:18px;font-weight:800;color:#111;
  }
  .num.selected{background:#111;color:#fff;border-color:#111}
  .event-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .event{
    min-height:60px;border:1px solid #b8b8b8;border-radius:12px;background:#fff;
    font-size:13px;font-weight:800;padding:8px;color:#111;
  }
  .event.active{background:#111;color:#fff;border-color:#111}
  .event.full{grid-column:1/-1}
  .stage-title{
    font-size:13px;font-weight:700;margin:12px 0 7px;
  }
  .selection{
    margin-top:10px;border:2px solid #111;border-radius:12px;padding:10px;text-align:center;
    font-weight:800;font-size:16px;background:#fff;
  }
  .flash{
    animation:flash .28s ease-out;
  }
  @keyframes flash{
    0%{transform:scale(.98);background:#111;color:#fff}
    100%{transform:scale(1);background:#fff;color:#111}
  }
  .log{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto}
  .log-row{
    display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;
    border-bottom:1px solid var(--soft);padding:7px 0;font-size:14px;
  }
  .badge{
    border:1px solid #aaa;border-radius:999px;padding:3px 7px;font-size:10px;white-space:nowrap;
  }
  .empty{text-align:center;color:#888;font-size:13px;padding:14px 0}
  .action{
    min-height:44px;border:1px solid #b8b8b8;border-radius:11px;background:#fff;
    font-size:13px;font-weight:700;color:#111;padding:8px;
  }
  .action.primary{background:#111;color:white;border-color:#111}
  .action.danger{color:#8c1f1f}
  .sticky{
    position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);
    border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    backdrop-filter:blur(8px);
  }
  .sticky-inner{
    max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;
  }
  .summary{font-size:12px;line-height:1.6}
  .mini-list{display:flex;flex-wrap:wrap;gap:6px}
  .mini{border:1px solid #bbb;border-radius:999px;padding:5px 8px;font-size:12px}
  .hidden{display:none!important}
  .toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
    background:#111;color:#fff;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;
    opacity:0;pointer-events:none;transition:opacity .15s ease;
    z-index:10;
  }
  .toast.show{opacity:1}
  @media(max-width:420px){
    .numbers{gap:6px}
    .num{min-height:48px;font-size:17px}
    .event{font-size:12px}
  }
</style>
</head>
<body>
<div class="app">
  <h1>試合スコア入力</h1>

  <div class="card">
    <div class="grid2">
      <div>
        <label>対戦チーム</label>
        <input id="opponent" type="text" placeholder="例：WAKABA" />
      </div>
      <div>
        <label>試合名</label>
        <input id="matchName" type="text" placeholder="例：予選①" />
      </div>
    </div>
  </div>

  <div class="card">
    <div class="sectionhead">
      <h2>出場選手（BLACK）</h2>
      <button class="action" id="clearRoster">解除</button>
    </div>
    <div class="numbers" id="rosterButtons"></div>
  </div>

  <div class="card">
    <h2 style="margin-bottom:10px">元外野</h2>
    <div class="grid2">
      <div>
        <div class="hint" style="margin-bottom:6px">BLACK</div>
        <div class="numbers" id="blackOutButtons"></div>
      </div>
      <div>
        <div class="hint" style="margin-bottom:6px">相手</div>
        <div class="numbers" id="oppOutButtons"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="sectionhead">
      <h2>プレーを記録</h2>
      <span class="badge" id="countBadge">0件</span>
    </div>

    <div class="event-grid">
      <button class="event" data-event="black_attack">BLACK<br>アタック成功</button>
      <button class="event" data-event="opp_attack">相手<br>アタック成功</button>
      <button class="event" data-event="black_caught">BLACKアタック<br>相手キャッチ成功</button>
      <button class="event" data-event="opp_caught">相手アタック<br>BLACKキャッチ成功</button>
      <button class="event full" data-event="assist">BLACK アシスト → アタック成功</button>
    </div>

    <div id="entryPanel" class="hidden">
      <div class="stage-title" id="fromLabel">① 背番号を選択</div>
      <div class="numbers" id="fromButtons"></div>

      <div class="stage-title" id="toLabel">② 背番号を選択</div>
      <div class="numbers" id="toButtons"></div>

      <div class="selection" id="selectionStatus">
        ①の背番号を選んでね
      </div>
      <div class="hint" style="margin-top:7px;text-align:center">
        ②の背番号を押した瞬間に自動で記録されます
      </div>
    </div>
  </div>

  <div class="card">
    <div class="sectionhead">
      <h2>記録ログ</h2>
      <button class="action danger" id="undoTop">1件戻す</button>
    </div>
    <div class="log" id="log"></div>
  </div>

  <div class="card">
    <h2 style="margin-bottom:8px">BLACK 集計</h2>
    <div class="summary" id="summary">まだ記録がありません。</div>
  </div>

  <div class="card">
    <div class="grid2">
      <button class="action" id="copySummary">記録をコピー</button>
      <button class="action" id="downloadCsv">CSV保存</button>
    </div>
    <div class="hint" style="margin-top:8px">
      記録はこのブラウザ内に自動保存。ホーム画面に追加して使うと、かなりアプリっぽく使えます。
    </div>
  </div>
</div>

<div class="toast" id="toast">記録したよ</div>

<div class="sticky">
  <div class="sticky-inner">
    <button class="action danger" id="undo">1件戻す</button>
    <button class="action" id="scrollTop">上へ</button>
    <button class="action primary" id="newMatch">新しい試合</button>
  </div>
</div>

<script>
const KEY = "blackowl_score_fast_v2";
const nums = Array.from({length:20},(_,i)=>i+1);

const meta = {
  black_attack:{
    label:"BLACK アタック成功",
    fromLabel:"① アタックしたBLACKの背番号",
    toLabel:"② 当たった相手の背番号",
    fromTeam:"BLACK",toTeam:"相手"
  },
  opp_attack:{
    label:"相手 アタック成功",
    fromLabel:"① アタックした相手の背番号",
    toLabel:"② 当たったBLACKの背番号",
    fromTeam:"相手",toTeam:"BLACK"
  },
  black_caught:{
    label:"相手 キャッチ成功",
    fromLabel:"① アタックしたBLACKの背番号",
    toLabel:"② キャッチした相手の背番号",
    fromTeam:"BLACK",toTeam:"相手"
  },
  opp_caught:{
    label:"BLACK キャッチ成功",
    fromLabel:"① アタックした相手の背番号",
    toLabel:"② キャッチしたBLACKの背番号",
    fromTeam:"相手",toTeam:"BLACK"
  },
  assist:{
    label:"BLACK アシスト",
    fromLabel:"① アシストしたBLACKの背番号",
    toLabel:"② アタック成功したBLACKの背番号",
    fromTeam:"BLACK",toTeam:"BLACK"
  }
};

let state={
  opponent:"",
  matchName:"",
  roster:[],
  blackOut:null,
  oppOut:null,
  logs:[]
};

let currentEvent=null;
let fromNum=null;

function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    if(x) state={...state,...x};
  }catch(e){}
}
function persist(){
  state.opponent=document.getElementById("opponent").value;
  state.matchName=document.getElementById("matchName").value;
  localStorage.setItem(KEY,JSON.stringify(state));
}
function vibrate(){
  try{ if(navigator.vibrate) navigator.vibrate(25); }catch(e){}
}
function toast(text){
  const t=document.getElementById("toast");
  t.textContent=text;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),700);
}
function buildNumbers(id,mode){
  const box=document.getElementById(id);
  box.innerHTML="";
  nums.forEach(n=>{
    const b=document.createElement("button");
    b.className="num";
    b.textContent=n;
    b.dataset.n=n;
    b.onclick=()=>numberTap(mode,n);
    box.appendChild(b);
  });
}
function numberTap(mode,n){
  if(mode==="roster"){
    const i=state.roster.indexOf(n);
    if(i>=0) state.roster.splice(i,1); else state.roster.push(n);
    state.roster.sort((a,b)=>a-b);
    persist(); renderStatic(); vibrate(); return;
  }
  if(mode==="blackOut"){
    state.blackOut=state.blackOut===n?null:n;
    persist();renderStatic();vibrate();return;
  }
  if(mode==="oppOut"){
    state.oppOut=state.oppOut===n?null:n;
    persist();renderStatic();vibrate();return;
  }
  if(mode==="from"){
    fromNum=n;
    renderEntry();
    vibrate();
    return;
  }
  if(mode==="to"){
    if(!currentEvent){
      toast("先にプレーを選んでね");
      return;
    }
    if(!fromNum){
      toast("先に①の背番号を選んでね");
      return;
    }
    autoSave(n);
  }
}
function renderStatic(){
  document.querySelectorAll("#rosterButtons .num").forEach(b=>{
    b.classList.toggle("selected",state.roster.includes(Number(b.dataset.n)));
  });
  document.querySelectorAll("#blackOutButtons .num").forEach(b=>{
    b.classList.toggle("selected",state.blackOut===Number(b.dataset.n));
  });
  document.querySelectorAll("#oppOutButtons .num").forEach(b=>{
    b.classList.toggle("selected",state.oppOut===Number(b.dataset.n));
  });
}
function chooseEvent(ev){
  currentEvent=ev;
  fromNum=null;
  document.querySelectorAll(".event").forEach(b=>b.classList.toggle("active",b.dataset.event===ev));
  const m=meta[ev];
  document.getElementById("fromLabel").textContent=m.fromLabel;
  document.getElementById("toLabel").textContent=m.toLabel;
  document.getElementById("entryPanel").classList.remove("hidden");
  renderEntry();
  vibrate();
}
function renderEntry(){
  document.querySelectorAll("#fromButtons .num").forEach(b=>{
    b.classList.toggle("selected",fromNum===Number(b.dataset.n));
  });
  document.querySelectorAll("#toButtons .num").forEach(b=>b.classList.remove("selected"));
  const st=document.getElementById("selectionStatus");
  if(!currentEvent){
    st.textContent="プレーを選んでね";
  }else if(!fromNum){
    st.textContent="①の背番号を選んでね";
  }else{
    const m=meta[currentEvent];
    st.textContent=`${m.fromTeam} ${fromNum} → ②をタップ`;
  }
}
function autoSave(toNum){
  const x={
    event:currentEvent,
    from:fromNum,
    to:toNum,
    t:new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",second:"2-digit"})
  };
  state.logs.push(x);
  persist();
  renderLog();
  renderSummary();

  const status=document.getElementById("selectionStatus");
  status.textContent=eventText(x);
  status.classList.remove("flash");
  void status.offsetWidth;
  status.classList.add("flash");
  vibrate();
  toast("記録したよ");

  // Keep the event selected for rapid repeated entry.
  // Reset only the first player so the next play is two quick taps.
  fromNum=null;
  setTimeout(renderEntry,260);
}
function eventText(x){
  if(x.event==="black_attack") return `BLACK ${x.from} → 相手 ${x.to}（アタック成功）`;
  if(x.event==="opp_attack") return `相手 ${x.from} → BLACK ${x.to}（アタック成功）`;
  if(x.event==="black_caught") return `BLACK ${x.from} → 相手 ${x.to}（キャッチ成功）`;
  if(x.event==="opp_caught") return `相手 ${x.from} → BLACK ${x.to}（キャッチ成功）`;
  if(x.event==="assist") return `BLACK ${x.from}（アシスト）→ ${x.to}（アタック成功）`;
  return "";
}
function renderLog(){
  const box=document.getElementById("log");
  document.getElementById("countBadge").textContent=`${state.logs.length}件`;
  if(!state.logs.length){
    box.innerHTML='<div class="empty">まだ記録がありません</div>';
    return;
  }
  box.innerHTML="";
  [...state.logs].reverse().forEach((x,idx)=>{
    const row=document.createElement("div");
    row.className="log-row";
    const n=state.logs.length-idx;
    row.innerHTML=`<div>${n}</div><div><strong>${eventText(x)}</strong><br><span class="hint">${x.t}</span></div><span class="badge">${meta[x.event].label}</span>`;
    box.appendChild(row);
  });
}
function count(event,field){
  const m={};
  state.logs.filter(x=>x.event===event).forEach(x=>m[x[field]]=(m[x[field]]||0)+1);
  return Object.entries(m).sort((a,b)=>Number(a[0])-Number(b[0]))
    .map(([n,c])=>`${n}番×${c}`).join("、")||"なし";
}
function renderSummary(){
  const el=document.getElementById("summary");
  if(!state.logs.length){el.textContent="まだ記録がありません。";return;}
  el.innerHTML=`
    <div><strong>アタック成功：</strong>${count("black_attack","from")}</div>
    <div><strong>被弾：</strong>${count("opp_attack","to")}</div>
    <div><strong>キャッチ成功：</strong>${count("opp_caught","to")}</div>
    <div><strong>相手にキャッチされたアタック：</strong>${count("black_caught","from")}</div>
    <div><strong>アシスト：</strong>${count("assist","from")}</div>
  `;
}
function undo(){
  if(!state.logs.length){toast("戻す記録がないよ");return;}
  const x=state.logs.pop();
  persist();renderLog();renderSummary();
  toast("1件戻したよ");
}
function newMatch(){
  if(!confirm("今の試合記録を消して、新しい試合を始める？")) return;
  const keep=confirm("出場選手は残す？");
  const roster=keep?[...state.roster]:[];
  state={opponent:"",matchName:"",roster,blackOut:null,oppOut:null,logs:[]};
  currentEvent=null;fromNum=null;
  localStorage.setItem(KEY,JSON.stringify(state));
  document.getElementById("opponent").value="";
  document.getElementById("matchName").value="";
  document.getElementById("entryPanel").classList.add("hidden");
  document.querySelectorAll(".event").forEach(b=>b.classList.remove("active"));
  renderAll();
  window.scrollTo({top:0,behavior:"smooth"});
}
function textExport(){
  const title=`${state.matchName||"試合"} / vs ${state.opponent||"相手"}`;
  const roster=state.roster.length?state.roster.join(", "):"未設定";
  let t=`${title}\n出場選手(BLACK): ${roster}\n元外野 BLACK:${state.blackOut??"未設定"} / 相手:${state.oppOut??"未設定"}\n\n`;
  state.logs.forEach((x,i)=>t+=`${i+1}. ${eventText(x)}\n`);
  return t;
}
async function copySummary(){
  const t=textExport();
  try{
    await navigator.clipboard.writeText(t);
    toast("コピーしたよ");
  }catch(e){
    prompt("この内容をコピーしてね",t);
  }
}
function downloadCSV(){
  const rows=[["No","時刻","種別","FROM","TO"]];
  state.logs.forEach((x,i)=>rows.push([i+1,x.t,meta[x.event].label,x.from,x.to]));
  const csv="\ufeff"+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`BLACK_OWL_${state.opponent||"試合"}_score.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function renderAll(){
  renderStatic();renderLog();renderSummary();
}

load();
["rosterButtons","blackOutButtons","oppOutButtons","fromButtons","toButtons"].forEach((id,i)=>{
  buildNumbers(id,["roster","blackOut","oppOut","from","to"][i]);
});
document.getElementById("opponent").value=state.opponent||"";
document.getElementById("matchName").value=state.matchName||"";

document.querySelectorAll(".event").forEach(b=>b.onclick=()=>chooseEvent(b.dataset.event));
document.getElementById("opponent").addEventListener("input",persist);
document.getElementById("matchName").addEventListener("input",persist);
document.getElementById("clearRoster").onclick=()=>{state.roster=[];persist();renderStatic()};
document.getElementById("undo").onclick=undo;
document.getElementById("undoTop").onclick=undo;
document.getElementById("newMatch").onclick=newMatch;
document.getElementById("scrollTop").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
document.getElementById("copySummary").onclick=copySummary;
document.getElementById("downloadCsv").onclick=downloadCSV;

renderAll();
</script>
</body>
</html>
